<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória - Helena</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f3e8ff 0%, #e0f2fe 100%);
      --card-back-bg: linear-gradient(135deg, #d8b4e2 0%, #a2d2ff 100%);
      --text: #4a4e69;
      --matched: #70e000;
      --shadow: 0 6px 14px rgba(100, 149, 237, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif; user-select: none; }
    body { background: var(--bg-gradient); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 14px; color: var(--text); }
    header { text-align: center; margin-bottom: 10px; width: 100%; max-width: 900px; }
    h1 { font-size: 2rem; color: #7b2cbf; text-shadow: 1px 1px 0 #fff; margin-bottom: 4px; }
    .subtitle { font-size: 1rem; color: #5c677d; font-weight: bold; }
    .nav-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0; max-width: 950px; }
    .tab-btn { background: #ffffff; border: 2px solid #c77dff; border-radius: 18px; padding: 6px 14px; font-size: 0.9rem; font-weight: bold; color: #6a4c93; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #c77dff, #90e0ef); color: #ffffff; border-color: #ffffff; }
    .controls-panel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; width: 100%; max-width: 900px; background: rgba(255,255,255,0.95); padding: 8px 16px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px; border: 2px solid #e0c3fc; }
    .stat-badge { font-size: 0.95rem; font-weight: bold; color: #5a189a; }
    .action-btn { background: #90e0ef; color: #03045e; border: none; border-radius: 10px; padding: 6px 14px; font-weight: bold; cursor: pointer; }
    .grid-container { width: 100%; max-width: 1050px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; perspective: 1000px; }
    @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 12px; } }
    .memory-card { position: relative; width: 100%; aspect-ratio: 1 / 1.15; cursor: pointer; transform-style: preserve-3d; transition: transform 0.4s ease; }
    .memory-card.flipped, .memory-card.matched { transform: rotateY(180deg); }
    .memory-card.matched { cursor: default; }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; border: 3px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.06); overflow: hidden; }
    .card-back { background: var(--card-back-bg); color: #ffffff; }
    .card-back .card-pattern { font-size: 2rem; }
    .card-back .card-label { font-size: 0.85rem; font-weight: bold; margin-top: 2px; }
    .card-front { background: #ffffff; transform: rotateY(180deg); border-color: #b8c0ff; }
    .memory-card.matched .card-front { border-color: var(--matched); background: #f4fbf0; }
    .card-img-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf8ff; border-radius: 8px; overflow: hidden; padding: 4px; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .card-text-wrap { font-size: 0.9rem; font-weight: bold; color: #2b2d42; line-height: 1.3; padding: 6px; display: flex; align-items: center; justify-content: center; height: 100%; }
    .victory-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .victory-modal.show { display: flex; }
    .modal-content { background: #fff; border-radius: 24px; padding: 26px 20px; text-align: center; max-width: 380px; width: 100%; border: 4px solid #c77dff; }
    .modal-content h2 { color: #7b2cbf; font-size: 1.7rem; margin-bottom: 8px; }
    .celebrate-btn { background: linear-gradient(135deg, #c77dff, #48cae4); color: #fff; border: none; border-radius: 16px; padding: 10px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>✨ Jogo da Memória da Helena ✨</h1>
    <div class="subtitle">Praticando inglês com carinho e diversão! 🌸</div>
  </header>

  <nav class="nav-tabs" id="tabs-container">
    <button class="tab-btn active" onclick="switchCategory('environment')">🌱 1. Environment</button>
    <button class="tab-btn" onclick="switchCategory('nature')">🏞️ 2. Nature</button>
    <button class="tab-btn" onclick="switchCategory('actions')">💡 3. Actions</button>
    <button class="tab-btn" onclick="switchCategory('comparisons')">⚖️ 4. Comparativos</button>
    <button class="tab-btn" onclick="switchCategory('characteristics')">🐾 5. Características</button>
    <button class="tab-btn" onclick="switchCategory('mix')">🌟 6. Super Mix!</button>
  </nav>

  <section class="controls-panel">
    <div class="stat-badge">⏱️ <span id="timer-display">00:00</span></div>
    <div class="stat-badge">🎯 Tentativas: <span id="moves-count">0</span></div>
    <div class="stat-badge">⭐ Pares: <span id="matches-count">0</span>/<span id="total-pairs-count">0</span></div>
    <button class="action-btn" onclick="initGame()">🔄 Reiniciar</button>
  </section>

  <main class="grid-container" id="grid-container"></main>

  <div class="victory-modal" id="victory-modal">
    <div class="modal-content">
      <h2>🎉 Parabéns, Helena! 🌟</h2>
      <p style="margin: 10px 0; font-size: 1.1rem; color: #495057;">Completaste todos os pares!</p>
      <p id="victory-summary" style="margin-bottom: 14px; font-weight: bold; color: #7b2cbf;"></p>
      <button class="celebrate-btn" onclick="closeVictory()">Jogar Novamente</button>
    </div>
  </div>

      actions: [

        { id: 'chr-14', text: 'The turtle is fast.', image: 'https://images.unsplash.com/photo-1518467166778-b88f373ffec7?w=500&q=80' },
        { id: 'chr-15', text: 'The parrots are funny.', image: 'https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=500&q=80' },

      ]
    };

    let currentCategory = 'environment';
    let cards = [], flippedCards = [], matchedPairs = 0, moves = 0, timerInterval = null, secondsElapsed = 0, isLocked = false;

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const buttons = document.querySelectorAll('.tab-btn');
      const map = { environment: 0, nature: 1, actions: 2, comparisons: 3, characteristics: 4, mix: 5 };
      if (buttons[map[cat]]) buttons[map[cat]].classList.add('active');
      initGame();
    }

    function initGame() {
      clearInterval(timerInterval);
      secondsElapsed = 0; moves = 0; matchedPairs = 0; flippedCards = []; isLocked = false;
      document.getElementById('timer-display').innerText = '00:00';
      document.getElementById('moves-count').innerText = '0';
      document.getElementById('matches-count').innerText = '0';

      let pairsToPlay = [];
      if (currentCategory === 'mix') {
        const pool = [
          ...DATA.environment.slice(0, 3),
          ...DATA.nature.slice(0, 3),
          ...DATA.comparisons.slice(0, 4),
          ...DATA.characteristics.slice(0, 4)
        ];
        pairsToPlay = pool.sort(() => 0.5 - Math.random()).slice(0, 10);
      } else {
        pairsToPlay = [...DATA[currentCategory]];
      }

      document.getElementById('total-pairs-count').innerText = pairsToPlay.length;
      cards = [];

      pairsToPlay.forEach((item, index) => {
        if (currentCategory === 'actions') {
          cards.push({ id: `c-${index}-a`, matchId: item.id, type: 'text', content: item.sideA });
          cards.push({ id: `c-${index}-b`, matchId: item.id, type: 'text', content: item.sideB });
        } else {
          cards.push({ id: `c-${index}-txt`, matchId: item.id, type: 'text', content: item.text });
          cards.push({ id: `c-${index}-img`, matchId: item.id, type: 'image', content: item.image, alt: item.text });
        }
      });

      cards.sort(() => 0.5 - Math.random());
      renderGrid();
      startTimer();
    }

    function renderGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      cards.forEach(card => {
        const cardElem = document.createElement('div');
        cardElem.className = 'memory-card';
        cardElem.dataset.id = card.id;

        const back = document.createElement('div');
        back.className = 'card-face card-back';
        back.innerHTML = '<span class="card-pattern">🌸</span><span class="card-label">HELENA</span>';

        const front = document.createElement('div');
        front.className = 'card-face card-front';

        if (card.type === 'text') {
          front.innerHTML = `<div class="card-text-wrap">${card.content}</div>`;
        } else {
          front.innerHTML = `<div class="card-img-wrap"><img src="${card.content}" alt="${card.alt || 'Imagem'}" loading="lazy" referrerpolicy="no-referrer"></div>`;
        }

        cardElem.appendChild(back);
        cardElem.appendChild(front);
        cardElem.addEventListener('click', () => handleCardClick(cardElem, card));
        container.appendChild(cardElem);
      });
    }

    function handleCardClick(elem, card) {
      if (isLocked || elem.classList.contains('flipped') || elem.classList.contains('matched')) return;

      elem.classList.add('flipped');
      flippedCards.push({ elem, card });

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves-count').innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [first, second] = flippedCards;

      if (first.card.matchId === second.card.matchId) {
        first.elem.classList.add('matched');
        second.elem.classList.add('matched');
        matchedPairs++;
        document.getElementById('matches-count').innerText = matchedPairs;
        flippedCards = [];
        isLocked = false;

        const total = parseInt(document.getElementById('total-pairs-count').innerText);
        if (matchedPairs === total) {
          clearInterval(timerInterval);
          setTimeout(showVictory, 400);
        }
      } else {
        setTimeout(() => {
          first.elem.classList.remove('flipped');
          second.elem.classList.remove('flipped');
          flippedCards = [];
          isLocked = false;
        }, 1100);
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function showVictory() {
      const time = document.getElementById('timer-display').innerText;
      document.getElementById('victory-summary').innerText = `Tempo: ${time} | Tentativas: ${moves}`;
      document.getElementById('victory-modal').classList.add('show');
    }

    function closeVictory() {
      document.getElementById('victory-modal').classList.remove('show');
      initGame();
    }

    window.onload = initGame;
  </script>
</body>
</html>
